# Workflow derived from https://github.com/r-lib/actions/blob/v2-branch/examples/check-standard.yaml

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, JAGS ${{ matrix.config.jags }})

    # Test both JAGS 4 (rjags 4-x) and JAGS 5 (rjags >= 5-x on CRAN since 2026-11) during the transition.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,    r: 'release',  jags: 5}
          - {os: macos-latest,    r: 'release',  jags: 4}
          - {os: windows-latest,  r: 'release',  jags: 5}
          - {os: windows-latest,  r: 'release',  jags: 4}
          - {os: windows-latest,  r: 'devel',    jags: 5}
          - {os: ubuntu-latest,   r: 'devel',    jags: 5, http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release',  jags: 5}
          - {os: ubuntu-latest,   r: 'release',  jags: 4}
          - {os: ubuntu-latest,   r: 'oldrel-1', jags: 4}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MCP_TEST_LEVEL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'release' || '' }}
      TESTTHAT_CPUS: 4
      JAGS4_VERSION: 4.3.2
      JAGS5_VERSION: 5.0.2

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # JAGS install before installing R dependencies
      - name: Install JAGS 4 (if Windows)
        if: runner.os == 'Windows' && matrix.config.jags == 4
        run: |
          curl.exe -o wjags.exe -L0 -k --url https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-%JAGS4_VERSION%.exe
          wjags.exe /S
          del wjags.exe
          echo JAGS_ROOT=C:/progra~1/JAGS/JAGS-%JAGS4_VERSION%>> %GITHUB_ENV%
        shell: cmd

      - name: Install JAGS 5 (if Windows)
        if: runner.os == 'Windows' && matrix.config.jags == 5
        run: |
          curl.exe -o wjags.exe -L0 -k --url https://downloads.sourceforge.net/project/mcmc-jags/JAGS/5.x/Windows/Rtools45/JAGS-%JAGS5_VERSION%.exe
          wjags.exe /S
          del wjags.exe
        shell: cmd

      - name: Install JAGS 4 (if macOS)
        if: runner.os == 'macOS' && matrix.config.jags == 4
        run: |
          sudo mkdir -p /usr/local/lib /usr/local/include /usr/local/bin
          brew unlink jags 2>/dev/null || true
          brew install pkgconf
          # Official universal installer (arm64 + x86_64). SourceForge mirrors are flaky, so try several.
          URLS=(
            "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-${JAGS4_VERSION}.pkg/download"
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Mac%20OS%20X/JAGS-${JAGS4_VERSION}.pkg"
            "https://netcologne.dl.sourceforge.net/project/mcmc-jags/JAGS/4.x/Mac%20OS%20X/JAGS-${JAGS4_VERSION}.pkg"
            "https://deac-fra.dl.sourceforge.net/project/mcmc-jags/JAGS/4.x/Mac%20OS%20X/JAGS-${JAGS4_VERSION}.pkg"
          )
          for url in "${URLS[@]}"; do
            echo "Attempting to download JAGS ${JAGS4_VERSION} from $url ..."
            if curl -L -k --retry 3 --connect-timeout 20 -o wjags.pkg "$url" && [ $(wc -c < wjags.pkg) -gt 1000000 ]; then
              break
            fi
            rm -f wjags.pkg
          done
          sudo installer -pkg wjags.pkg -target /
          rm -f wjags.pkg
          ls -la /usr/local/lib/libjags*
          if [ -d /opt/homebrew/bin ]; then
            sudo ln -sf /usr/local/bin/jags /opt/homebrew/bin/jags
          fi

      - name: Install JAGS 5 (if macOS)
        if: runner.os == 'macOS' && matrix.config.jags == 5
        run: |
          brew unlink jags 2>/dev/null || true
          brew install pkgconf
          curl -L --retry 3 -o jags5.pkg "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/macOS/JAGS-${JAGS5_VERSION}-universal.pkg/download"
          sudo installer -pkg jags5.pkg -target /
          rm jags5.pkg
          JAGS_PC=$(find /opt/jags /usr/local -name jags.pc 2>/dev/null | head -1)
          echo "Found $JAGS_PC"
          echo "PKG_CONFIG_PATH=$(dirname "$JAGS_PC")" >> "$GITHUB_ENV"

      # No JAGS 5 apt package yet. Installed to /usr/local, which pkg-config prefers over the apt JAGS 4 that pak may install.
      - name: Install JAGS 5 (if Linux)
        if: runner.os == 'Linux' && matrix.config.jags == 5
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev pkg-config
          curl -L --retry 3 -o jags5.tar.gz "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-${JAGS5_VERSION}.tar.gz/download"
          tar xzf jags5.tar.gz
          cd JAGS-${JAGS5_VERSION}
          ./configure --prefix=/usr/local
          make -j4
          sudo make install
          sudo ldconfig
          pkg-config --modversion jags

      # rjags on CRAN requires JAGS 5, so pin rjags 4-x for JAGS 4.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr${{ matrix.config.jags == 4 && ', rjags@4-17' || '' }}
          needs: check, coverage

      - name: Show rjags and JAGS versions
        run: |
          library(rjags)
          print(packageVersion("rjags"))
          print(jags.version())
        shell: Rscript {0}

      # Install TinyTeX only on one runner to verify PDF manual
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.jags == 5

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ (matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.jags == 5) && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}

      # Run test coverage on the fastest-to-run job
      - name: Test coverage
        if: matrix.config.os == 'macos-latest' && matrix.config.r == 'release' && matrix.config.jags == 5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}
