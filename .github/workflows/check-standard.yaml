# Workflow derived from https://github.com/r-lib/actions/blob/v2-branch/examples/check-standard.yaml

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: windows-latest,  r: 'devel'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # JAGS install before installing R dependencies
      - name: Install JAGS (if Windows)
        if: runner.os == 'Windows'
        run: |
          curl.exe -o wjags.exe -L0 -k --url https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.2.exe
          wjags.exe /S
          del wjags.exe
        shell: cmd

      # Homebrew on Apple Silicon puts JAGS in /opt/homebrew, but CRAN rjags binaries expect /usr/local/lib
      - name: Install JAGS (if macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jags || brew upgrade jags || true
          brew link --overwrite jags || true
          sudo mkdir -p /usr/local/lib /usr/local/include
          JAGS_PREFIX="$(brew --prefix jags 2>/dev/null || echo '/opt/homebrew/opt/jags')"
          if [ -f "$JAGS_PREFIX/lib/libjags.4.dylib" ]; then
            sudo ln -sf "$JAGS_PREFIX/lib/libjags.4.dylib" /usr/local/lib/libjags.4.dylib
          fi
          if [ -d "$JAGS_PREFIX/lib" ]; then
            sudo ln -sf "$JAGS_PREFIX"/lib/libjags* /usr/local/lib/ 2>/dev/null || true
            sudo ln -sf "$JAGS_PREFIX"/lib/libjrmath* /usr/local/lib/ 2>/dev/null || true
          fi
          if [ -d "$JAGS_PREFIX/include/JAGS" ]; then
            sudo ln -sf "$JAGS_PREFIX/include/JAGS" /usr/local/include/
          fi
          if [ -d /opt/homebrew/lib ]; then
            sudo ln -sf /opt/homebrew/lib/libjags* /usr/local/lib/ 2>/dev/null || true
            sudo ln -sf /opt/homebrew/lib/libjrmath* /usr/local/lib/ 2>/dev/null || true
          fi
          ls -la /usr/local/lib/libjags* || true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr
          needs: check, coverage

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # Run test coverage on the fastest-to-run job
      - name: Test coverage
        if: matrix.config.os == 'macos-latest' && matrix.config.r == 'release'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}
