development:
  mode: auto

template:
  bootstrap: 5
  math-rendering: katex
  params:
    bootswatch: flatly  # Theme
    ganalytics: UA-1026978-3  # Google Analytics
    docsearch:
      api_key: 702ab134d40a7310606c29f341fc5014
      index_name: lindeloev_mcp
  opengraph:
    image:
        src: https://github.com/lindeloev/mcp/raw/docs/man/figures/logo.png  # For Twitter card
    twitter:
        creator: "@jonaslindeloev"
        card: summary


# Writes sitemap etc.
url: https://lindeloev.github.io/mcp

authors:
  Jonas Kristoffer Lindeløv:
    href: http://lindeloev.net

# Structure of the reference page
reference:

  - title: Fit and show mcpfit
    desc: mcp() returns and `mcpfit`. These functions illuminate what this fit contains structurally.
    contents:
      - mcp
      - mcp-package
      - mcp_pars
      - mcp_columns
      - prior_summary
      - print.mcplist
      - print.mcptext
      - is.mcpfit
      - model-accessors-mcpfit
      - mcpfit-class

  - title: Visual summaries
    desc: Plotting of fits, parameters, and diagnostics.
    contents:
      - plot.mcpfit
      - plot_pars
      - pp_check
      - interpolate_newdata

  - title: Textual summaries and statistics
    desc: Summaries that pertain to the whole `mcpfit` or to specific parameters.
    contents:
      - summary.mcpfit
      - fixef
      - ranef
      - posterior-uncertainty-mcpfit
      - hypothesis
      - loo
      - waic

  - title: Extract draws or data
    desc: Per-observation summaries or draws
    contents:
      - fitted
      - predict
      - residuals
      - log_lik
      - posterior_epred.mcpfit

      - as_draws.mcpfit
      - draws-index-mcp



  - title: Families
    desc: Distributional families that are not available in base R.
    contents:
      - bernoulli
      - negbinomial
      - mcpfamily

  - title: Help and demos
    desc: Some showcases of typical mcp analyses. Most of these are discussed on the [front page](https://lindeloev.github.io/mcp).
    contents:
      - mcp_example
      - demo_fit

  - title: Deprecated
    desc: Functions retained for backward compatibility.
    contents:
      - sd_to_prec

redirects:
  - ["articles/varying.html", "articles/group_effects.html"]
  - ["articles/variance.html", "articles/dpar.html"]

